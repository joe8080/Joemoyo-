name: AutoTrader (paper)

# DISABLED schedule: this job now runs inside the always-on Railway
# container (realtime/supervisor.py) — GitHub's copy of the Alpaca keys
# went stale after rotation and every run silently 401'd. Kept for
# manual fallback only (Run workflow) once repo secrets are refreshed.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: autotrade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run one trading cycle
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_PAPER: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # The deterministic strategy never calls Anthropic; this only
          # satisfies the settings module's startup check.
          ANTHROPIC_API_KEY: "unused-by-autotrader"
        run: >
          python main.py autotrade
          --symbols SPY,QQQ,AAPL,MSFT,NVDA,GOOGL,AMZN,META,TSLA,AMD
          --once
          --budget 50000
          --cash-per-trade 5000
          --max-positions 10
          --enter-on-trend
          --trailing-stop-pct 8
