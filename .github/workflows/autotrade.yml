name: AutoTrader (paper)

on:
  schedule:
    # Every 30 min, 13:00–20:59 UTC, Mon–Fri — covers US market hours
    # (9:30–16:00 ET) year-round. The bot itself skips when the market
    # is closed, so off-hours/holiday runs are harmless no-ops.
    - cron: "*/30 13-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: autotrade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run one trading cycle
        env:
          # Key ID is a non-secret identifier (useless without the secret
          # key); inlined as a fallback because repo secrets can only be
          # set by the owner. A real ALPACA_API_KEY_ID secret wins if added.
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID || 'PKPGSH5CZF7QJRVJ4YT7CVVZDM' }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_PAPER: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Agent OS board (optional): check in so the card updates live and
          # the board's Pause button is honoured. Keys from `os connect`.
          AGENT_OS_URL: ${{ secrets.AGENT_OS_URL }}
          AGENT_OS_KEYS: ${{ secrets.AGENT_OS_KEYS }}
          # The deterministic strategy never calls Anthropic; this only
          # satisfies the settings module's startup check.
          ANTHROPIC_API_KEY: "unused-by-autotrader"
        run: >
          python main.py autotrade
          --symbols SPY,QQQ,AAPL,MSFT,NVDA,GOOGL,AMZN,META,TSLA,AMD
          --once
          --budget 50000
          --cash-per-trade 5000
          --max-positions 10
          --enter-on-trend
          --trailing-stop-pct 8
