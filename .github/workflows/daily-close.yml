name: Daily Close Ritual

# After the bell, regenerate the trading journal: round-trip ledger, coach note,
# and tendencies — then commit them so the hosted Streamlit dashboard updates
# itself with no manual step (the SMB "daily close ritual" idea, automated).

on:
  schedule:
    # 20:20 UTC ~ 16:20 ET, a few minutes after the US close, weekdays.
    - cron: "20 20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Generate coach report
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID || 'PKPGSH5CZF7QJRVJ4YT7CVVZDM' }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_PAPER: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Real key -> Claude writes the narrative; placeholder -> deterministic
          # stats-only note (the report still generates either way).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'unused-deterministic-note' }}
        run: python main.py coach

      - name: Commit journal updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/reports/coach_*.md outputs/reports/tendencies.json outputs/reports/ledger.json outputs/reports/trades.csv 2>/dev/null || true
          git commit -m "Daily close: refresh journal & coach note" || echo "nothing to commit"
          git push || echo "nothing to push"
