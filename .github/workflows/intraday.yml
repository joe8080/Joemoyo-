name: AutoTrader Intraday (paper)

# Day-trading engine: opening-range breakout, validated. Runs as a SESSION
# RUNNER, not a per-5-min cron: GitHub silently drops high-frequency (*/5)
# schedules, so instead we fire ONCE per day at 14:00 UTC (10:00 ET — exactly
# when the 30-min opening range has formed and the first breakouts can occur)
# and then loop internally every 5 minutes for the rest of the session,
# flattening before the close. One reliable daily trigger >> an unreliable
# every-5-min schedule. (A real-time host is the eventual upgrade.)

on:
  schedule:
    - cron: "0 14 * * 1-5"   # 10:00 ET, after the opening range forms
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: autotrade-intraday
  cancel-in-progress: true

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 360        # ~6h: 10:00 ET -> 16:00 ET close
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the intraday session (loops every 5 min, flattens at close)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID || 'PKPGSH5CZF7QJRVJ4YT7CVVZDM' }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_PAPER: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: "unused-by-autotrader"
        run: >
          python main.py autotrade
          --symbols NFLX,AVGO,COIN,IWM,SMH
          --interval 5
          --mode intraday
          --strategy orb
          --timeframe 5Min
          --or-bars 6
          --budget 10000
          --cash-per-trade 2000
          --max-positions 5
          --market-filter
          --trailing-stop-pct 3
          --daily-loss-limit 500
          --flatten-eod
