name: AutoTrader Intraday (paper)

# DISABLED schedule: the intraday engine now runs as an always-on process on
# Railway (realtime/Dockerfile), which is reliable — unlike GitHub's dropped
# crons. Kept here for manual fallback only (Run workflow), so it can never
# double-trade against the Railway runner on the same account.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: autotrade-intraday
  cancel-in-progress: true

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 360        # ~6h: 10:00 ET -> 16:00 ET close
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the intraday session (loops every 5 min, flattens at close)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID || 'PKPGSH5CZF7QJRVJ4YT7CVVZDM' }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_PAPER: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: "unused-by-autotrader"
        run: >
          python main.py autotrade
          --symbols NFLX,AVGO,COIN,IWM,SMH
          --interval 5
          --mode intraday
          --strategy orb
          --timeframe 5Min
          --or-bars 6
          --budget 10000
          --cash-per-trade 2000
          --max-positions 5
          --market-filter
          --trailing-stop-pct 3
          --daily-loss-limit 500
          --flatten-eod
