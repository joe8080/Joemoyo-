<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="assets/gsap.min.js"></script>
<style>
  @font-face { font-family: "Cinzel"; src: url("assets/fonts/Cinzel.ttf"); font-weight: 400 900; }
  @font-face { font-family: "Lora"; src: url("assets/fonts/Lora.ttf"); font-weight: 400 700; }
  html, body { margin: 0; background: #152121; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #152121; }
  #plate-wrap { position: absolute; inset: -4%; }
  #plate { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.22; }
  #shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 48%, rgba(21,33,33,0.55) 0%, rgba(13,20,20,0.88) 72%, rgba(6,9,9,0.96) 100%); }
  .center { position: absolute; left: 0; width: 1920px; text-align: center; }
  #kicker { top: 382px; font-family: "Cinzel"; font-weight: 600; font-size: 36px; letter-spacing: 9px; color: #c9a45c; }
  #rule { position: absolute; left: 890px; top: 468px; width: 140px; height: 2px; background: #c9a45c; }
  #q { top: 512px; font-family: "Lora"; font-weight: 500; font-size: 92px; color: #efe6d2; }
  #q span { display: inline-block; margin: 0 12px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="7.7" data-width="1920" data-height="1080">
  <div id="plate-wrap" class="clip" data-start="0" data-duration="7.7" data-track-index="1"><img id="plate" src="assets/img/plate.jpg"></div>
  <div id="shade" class="clip" data-start="0" data-duration="7.7" data-track-index="2"></div>
  <div id="kicker" class="center clip" data-start="0" data-duration="7.7" data-track-index="3">THE QUESTION</div>
  <div id="rule" class="clip" data-start="0" data-duration="7.7" data-track-index="4"></div>
  <div id="q" class="center clip" data-start="0" data-duration="7.7" data-track-index="5"><span>How</span><span>did</span><span>the</span><span>Zulu</span><span>army</span><span>win?</span></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#plate-wrap", { x: 0 }, { x: -40, duration: 7.7, ease: "power2.inOut" }, 0);
  tl.fromTo("#kicker", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.3);
  tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power4.out" }, 0.55);
  tl.fromTo("#q span", { opacity: 0, color: "#7d7a72" }, { opacity: 1, color: "#efe6d2", duration: 0.3, ease: "power2.out", stagger: 0.09 }, 1.7);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
