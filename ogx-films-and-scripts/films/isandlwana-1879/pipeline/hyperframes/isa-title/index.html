<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="assets/gsap.min.js"></script>
<style>
  @font-face { font-family: "Cinzel"; src: url("assets/fonts/Cinzel.ttf"); font-weight: 400 900; }
  @font-face { font-family: "Lora"; src: url("assets/fonts/Lora.ttf"); font-weight: 400 700; }
  html, body { margin: 0; background: #0d0f0f; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0d0f0f; }
  #plate-wrap { position: absolute; inset: -6%; }
  #plate { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  #shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(10,14,14,0.45) 0%, rgba(10,14,14,0.78) 70%, rgba(5,7,7,0.92) 100%); }
  .center { position: absolute; left: 0; width: 1920px; text-align: center; }
  #kicker { top: 318px; font-family: "Cinzel"; font-weight: 600; font-size: 30px; letter-spacing: 8px; color: #c9a45c; }
  #title { top: 420px; font-family: "Cinzel"; font-weight: 700; font-size: 168px; line-height: 200px; color: #c9a45c; letter-spacing: 6px; text-shadow: 0 6px 30px rgba(0,0,0,0.6); }
  #title span { display: inline-block; }
  #rule { position: absolute; left: 800px; top: 662px; width: 320px; height: 2px; background: #c9a45c; transform-origin: 50% 50%; }
  #date { top: 690px; font-family: "Cinzel"; font-weight: 500; font-size: 56px; letter-spacing: 10px; color: #efe6d2; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1920" data-height="1080">
  <div id="plate-wrap" class="clip" data-start="0" data-duration="7" data-track-index="1"><img id="plate" src="assets/img/plate.jpg"></div>
  <div id="shade" class="clip" data-start="0" data-duration="7" data-track-index="2"></div>
  <div id="kicker" class="center clip" data-start="0" data-duration="7" data-track-index="3">ORIGINEX HUMAN ARCHIVES</div>
  <div id="title" class="center clip" data-start="0" data-duration="7" data-track-index="4"><span>I</span><span>S</span><span>A</span><span>N</span><span>D</span><span>L</span><span>W</span><span>A</span><span>N</span><span>A</span></div>
  <div id="rule" class="clip" data-start="0" data-duration="7" data-track-index="5"></div>
  <div id="date" class="center clip" data-start="0" data-duration="7" data-track-index="6">1879</div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#plate-wrap", { scale: 1.0 }, { scale: 1.06, duration: 7, ease: "power2.inOut" }, 0);
  tl.fromTo("#kicker", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.35);
  tl.fromTo("#title span", { opacity: 0.0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out", stagger: 0.1 }, 0.7);
  tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power4.out" }, 1.9);
  tl.fromTo("#date", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 2.25);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
