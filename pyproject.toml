[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-agent"
version = "0.1.0"
description = "Images + audio -> cinematic video with Ken Burns effects. Presets for history and AI-finance channels."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Joemoyo" }]
keywords = ["video", "ffmpeg", "ken-burns", "youtube", "shorts"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
video-agent = "video_agent.cli:main"

[tool.setuptools.packages.find]
include = ["video_agent*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
