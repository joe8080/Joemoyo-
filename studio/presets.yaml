# House styles. Edit freely: every new project copies its preset, so changes
# here never alter a video already in progress.
#
#   wpm           narration pace, words per minute
#   shot_seconds  average seconds each picture stays on screen
#   hero_every    animate every Nth shot with a paid video model (0 = stills only)
#   scene_chars   most characters sent to the voice tool in one job
#   music_db      music level under the voice, in decibels

history: &history
  brand: history_channel
  label: History documentary, widescreen
  aspect: "16:9"
  resolution: [1920, 1080]
  fps: 30
  wpm: 145
  shot_seconds: 7
  hero_every: 0
  scene_chars: 1500
  style: >-
    cinematic historical illustration, painterly realism, dramatic low-key
    lighting, muted earth tones, subtle film grain, no text, no watermark
  voice: deep, measured documentary narrator, British English
  music: slow cinematic orchestral, low strings, sparse percussion
  music_db: -20
  motion: [zoom_in, pan_right, zoom_out, pan_left]

history_short:
  <<: *history
  label: History short, vertical
  aspect: "9:16"
  resolution: [1080, 1920]
  shot_seconds: 3

finance: &finance
