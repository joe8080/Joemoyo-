name: Daily Close Ritual

# After the bell, regenerate the journal (round-trip ledger, coach note,
# tendencies) and commit it so a hosted dashboard self-updates.

on:
  schedule:
    - cron: "20 20 * * 1-5"   # ~16:20 ET, after the US close
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate coach report
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_PAPER: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Real key -> Claude writes the narrative; placeholder -> deterministic note.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'unused-deterministic-note' }}
        run: python main.py coach
      - name: Commit journal updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/reports/*.md outputs/reports/*.json outputs/reports/trades.csv 2>/dev/null || true
          git commit -m "Daily close: refresh journal & coach note" || echo "nothing to commit"
          git push || echo "nothing to push"
